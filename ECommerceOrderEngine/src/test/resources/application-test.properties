spring.application.name=ecommerce-order-engine
ecommerce.version=6
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_test_db
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

security.jwt.secret=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
security.jwt.issuer=https://ecommerce-order-engine
security.jwt.access-token-seconds=900

security.recaptcha.project-id=test-ecommerce-project
security.recaptcha.site-key=test-recaptcha-site-key
security.recaptcha.api-key=test-recaptcha-api-key
security.recaptcha.minimum-score=0.5

app.frontend.url=http://localhost:5173

ecommerce.persistence=hibernate

security.google-oauth.enabled=false

spring.security.oauth2.client.registration.google.client-id=test-google-client
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
