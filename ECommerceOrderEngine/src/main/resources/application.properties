spring.application.name=ecommerce-order-engine

ecommerce.version=6
ecommerce.persistence=hibernate


# Database


spring.datasource.url=${ECOMMERCE_DB_URL:jdbc:mysql://localhost:3306/ecommerce_db}
spring.datasource.username=${ECOMMERCE_DB_USER:root}
spring.datasource.password=${ECOMMERCE_DB_PASSWORD}



# JPA / Hibernate


spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

audit.excel.path=logs/audit-log.xlsx



management.endpoint.health.show-details=always

management.metrics.tags.application=ecommerce-order-engine

management.endpoints.web.exposure.include=health,info,metrics,prometheus

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1


security.recaptcha.project-id=ecommerceorderengine
security.recaptcha.site-key=6LdSWgsuAAAAALcB07E1uDkpAAfoHN116KrFiaBe
security.recaptcha.api-key=${RECAPTCHA_API_KEY:}
security.recaptcha.minimum-score=0.5


spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

security.google-oauth.enabled=${GOOGLE_OAUTH_ENABLED:false}

app.frontend.url=${FRONTEND_URL:http://localhost:5173}