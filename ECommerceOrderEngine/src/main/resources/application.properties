
# ==========================================
# APPLICATION
# ==========================================

spring.application.name=ecommerce-order-engine

ecommerce.version=6
ecommerce.persistence=hibernate


# ==========================================
# DATABASE
# ==========================================

spring.datasource.url=${ECOMMERCE_DB_URL:jdbc:mysql://localhost:3306/ecommerce_db}
spring.datasource.username=${ECOMMERCE_DB_USER:root}
spring.datasource.password=${ECOMMERCE_DB_PASSWORD}


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# ==========================================
# FLYWAY
# ==========================================

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1


# ==========================================
# AUDIT LOGGING
# ==========================================

audit.excel.path=${AUDIT_EXCEL_PATH:logs/audit-log.xlsx}


# ==========================================
# ACTUATOR / MONITORING
# ==========================================

management.endpoint.health.show-details=never

management.metrics.tags.application=ecommerce-order-engine

management.endpoints.web.exposure.include=health,info,metrics,prometheus


# ==========================================
# GOOGLE RECAPTCHA ENTERPRISE
# ==========================================

security.recaptcha.project-id=ecommerceorderengine

security.recaptcha.site-key=6LdSWgsuAAAAALcB07E1uDkpAAfoHN116KrFiaBe

security.recaptcha.api-key=${RECAPTCHA_API_KEY:}

security.recaptcha.minimum-score=0.5


# ==========================================
# GOOGLE OAUTH2
# ==========================================


security.google-oauth.enabled=${GOOGLE_OAUTH_ENABLED:false}


# ==========================================
# FRONTEND URL
# ==========================================

app.frontend.url=${FRONTEND_URL:http://localhost:5173}


# ==========================================
# PRODUCT IMAGE STORAGE
# ==========================================

# Local development: local
# AWS deployment: s3
app.images.storage.type=${IMAGE_STORAGE_TYPE:local}

# Existing local storage directory
app.product-images.storage-directory=${PRODUCT_IMAGE_STORAGE_DIR:./local-uploads/product-images}

# AWS S3 configuration
app.images.s3.bucket=${PRODUCT_IMAGES_S3_BUCKET:}
app.images.s3.region=${AWS_REGION:ap-south-1}
app.images.s3.prefix=product-images/


# ==========================================
# MULTIPART IMAGE UPLOADS
# ==========================================

spring.servlet.multipart.enabled=true

spring.servlet.multipart.max-file-size=5MB

spring.servlet.multipart.max-request-size=6MB


# ==========================================
# ONE-TIME MIGRATION RUNNERS
# ==========================================

app.catalog.seed.enabled=false

app.catalog.expansion.enabled=false

app.images.import.enabled=false
