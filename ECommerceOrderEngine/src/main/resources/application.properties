spring.application.name=ecommerce-order-engine

ecommerce.version=6
ecommerce.persistence=hibernate


# Database


spring.datasource.url=${ECOMMERCE_DB_URL:jdbc:mysql://localhost:3306/ecommerce_db}
spring.datasource.username=${ECOMMERCE_DB_USER:root}
spring.datasource.password=${ECOMMERCE_DB_PASSWORD}



# JPA / Hibernate


spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

audit.excel.path=logs/audit-log.xlsx